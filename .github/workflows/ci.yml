name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-x86_64:
    name: Test (x86-64 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bootstrap/stage0/jda1 is committed and verified. Do NOT rebuild it here:
      # jda1-bootstrap run natively produces a jda1 that hangs on every input
      # (build succeeds, the resulting compiler then times out), while the same
      # bootstrap under linux/amd64 emulation produces a working compiler.
      # Tracked separately; the rebuild is exercised below without gating.
      - name: Verify committed compiler
        run: |
          ulimit -s unlimited
          chmod +x bootstrap/stage0/jda1
          echo "jda1: $(wc -c < bootstrap/stage0/jda1) bytes"
          timeout 30 bootstrap/stage0/jda1 examples/hello.jda /tmp/hello
          chmod +x /tmp/hello
          test "$(/tmp/hello)" = "Hello Bare Metal"
          echo "committed compiler OK"

      - name: Run conformance tests
        run: |
          ulimit -s unlimited
          bash tools/run_tests.sh

      - name: Output hygiene
        run: |
          ulimit -s unlimited
          bash tests/output-hygiene-test.sh

      - name: Rejected syntax
        run: |
          ulimit -s unlimited
          bash tests/rejected-syntax-test.sh

      - name: Diagnostics contract
        run: |
          ulimit -s unlimited
          bash tests/diagnostics-test.sh

      - name: Stdlib index is current
        run: python3 tools/jda-index.py --check

      - name: Self-host convergence (native)
        continue-on-error: true
        run: |
          ulimit -s unlimited
          echo "=== Stage 2: committed jda1 -> jda1_a ==="
          timeout 300 bootstrap/stage0/jda1 bootstrap/stage1/jda1.jda /tmp/jda1_a; echo "rc=$?"
          chmod +x /tmp/jda1_a
          echo "=== jda1_a compiling hello ==="
          timeout 60 /tmp/jda1_a examples/hello.jda /tmp/h_a >/dev/null 2>&1; echo "rc=$?"
          chmod +x /tmp/h_a 2>/dev/null && echo "ran: $(timeout 10 /tmp/h_a)" || echo "no binary"
          echo "=== Stage 3: jda1_a -> jda1_b ==="
          timeout 300 /tmp/jda1_a bootstrap/stage1/jda1.jda /tmp/jda1_b; echo "rc=$?"
          chmod +x /tmp/jda1_b 2>/dev/null
          cmp /tmp/jda1_a /tmp/jda1_b && echo "CONVERGED" || echo "DIVERGED or incomplete"

      # Known-failing: proves the native rebuild bug is still present.
      - name: Native bootstrap rebuild (known issue, non-gating)
        continue-on-error: true
        run: |
          ulimit -s unlimited
          timeout 300 bootstrap/bin/jda1-bootstrap bootstrap/stage1/jda1.jda /tmp/jda1_native; echo "build rc=$?"
          chmod +x /tmp/jda1_native
          timeout 30 /tmp/jda1_native examples/hello.jda /tmp/h_native >/dev/null 2>&1
          rc=$?
          echo "compile rc=$rc"
          if [ $rc -eq 124 ]; then echo "KNOWN ISSUE: natively-rebuilt jda1 hangs"; fi

  test-arm64:
    name: Test (ARM64 Linux)
    runs-on: ubuntu-24.04-arm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Verify ARM64 platform
        run: |
          echo "Architecture: $(uname -m)"
          test "$(uname -m)" = "aarch64"

      - name: Run ARM64 tool tests
        run: |
          bash tools/jda-arm64.sh --asm tests/conformance/stage1/pass/arm64_basic.jda > /dev/null
          echo "ARM64 assembly generation: OK"

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Verify macOS platform
        run: |
          echo "Platform: $(uname -s) $(uname -m)"
          sw_vers

      - name: Run macOS tool tests
        run: |
          echo "Testing jda-macos assembly generation..."
          bash tools/jda-macos.sh --asm tests/conformance/stage1/pass/macos_basic.jda > /dev/null
          echo "macOS assembly generation: OK"

      - name: Build and run native macOS binary
        run: |
          printf 'fn main() {\n  print "ci ok"\n  ret 0\n}\n' > /tmp/ci_test.jda
          bash tools/jda-macos.sh -o /tmp/ci_test /tmp/ci_test.jda
          out="$(/tmp/ci_test)"
          test "$out" = "ci ok"
          echo "Native macOS binary execution: OK"

  test-wasm:
    name: Test (WebAssembly)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Run WASM tool tests
        run: |
          bash tools/jda-wasm.sh --wat tests/conformance/stage1/pass/wasm_basic.jda > /dev/null
          echo "WASM WAT generation: OK"

  benchmark:
    name: Benchmark regression check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build jda1
        run: |
          ulimit -s unlimited
          bootstrap/bin/jda1-bootstrap bootstrap/stage1/jda1.jda bootstrap/stage0/jda1
          chmod +x bootstrap/stage0/jda1

      - name: Run benchmarks
        run: |
          ulimit -s unlimited
          bash tools/bench-ci.sh

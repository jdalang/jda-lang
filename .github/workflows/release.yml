name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build jda1 from bootstrap
        run: |
          ulimit -s unlimited
          bootstrap/bin/jda1-bootstrap bootstrap/stage1/jda1.jda bootstrap/stage0/jda1
          chmod +x bootstrap/stage0/jda1

      - name: Self-host convergence check
        run: |
          ulimit -s unlimited
          bootstrap/stage0/jda1 bootstrap/stage1/jda1.jda /tmp/jda1_a 2>/dev/null
          chmod +x /tmp/jda1_a
          /tmp/jda1_a bootstrap/stage1/jda1.jda /tmp/jda1_b 2>/dev/null
          chmod +x /tmp/jda1_b
          cmp /tmp/jda1_a /tmp/jda1_b
          echo "CONVERGED — $(wc -c < /tmp/jda1_a) bytes"

      - name: Package release
        run: bash tools/package-release.sh ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Jda v${{ steps.version.outputs.version }}
          body: |
            ## Jda v${{ steps.version.outputs.version }}

            ### Installation

            ```bash
            curl -fsSL https://raw.githubusercontent.com/jdalang/jda-lang/main/install.sh | bash
            ```

            Or download the tarball below and extract manually.

            ### What's included

            - `jda` — the Jda compiler (Linux x86-64, statically linked)
            - `stdlib/` — standard library (fs, fmt, time)

            ### Verify

            ```bash
            jda --version
            ```
          files: |
            dist/jda-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
            dist/checksums.txt

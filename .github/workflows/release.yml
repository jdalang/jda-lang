name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux-x86_64:
    name: Build (Linux x86-64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build jda1
        run: |
          ulimit -s unlimited
          bootstrap/bin/jda1-bootstrap bootstrap/stage1/jda1.jda bootstrap/stage0/jda1
          chmod +x bootstrap/stage0/jda1

      - name: Self-host convergence
        run: |
          ulimit -s unlimited
          bootstrap/stage0/jda1 bootstrap/stage1/jda1.jda /tmp/jda1_a 2>/dev/null
          chmod +x /tmp/jda1_a
          /tmp/jda1_a bootstrap/stage1/jda1.jda /tmp/jda1_b 2>/dev/null
          chmod +x /tmp/jda1_b
          cmp /tmp/jda1_a /tmp/jda1_b
          echo "CONVERGED — $(wc -c < /tmp/jda1_a) bytes"

      - name: Run conformance tests
        run: |
          ulimit -s unlimited
          bash tools/run_tests.sh

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash tools/package-release.sh "$VERSION"

      - name: Build .deb package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash installers/build-deb.sh "$VERSION"

      - name: Build .rpm package
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          VERSION="${GITHUB_REF_NAME#v}"
          bash installers/build-rpm.sh "$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/

  build-linux-arm64:
    name: Build (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Package ARM64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash tools/package-release.sh "$VERSION" arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist/

  build-macos:
    name: Build (macOS .pkg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash tools/package-release.sh "$VERSION" macos

      - name: Build .pkg installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash installers/build-pkg.sh "$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  build-windows:
    name: Build (Windows .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build .exe installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installers\jda-setup.iss
        env:
          JDA_VERSION: ${{ steps.version.outputs.version }}

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  release:
    name: Create Release
    needs: [build-linux-x86_64, build-linux-arm64, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Merge checksums
        run: |
          cd dist
          cat */checksums.txt > checksums.txt 2>/dev/null || true
          # Generate checksums for all release files
          find . -name "*.tar.gz" -o -name "*.deb" -o -name "*.rpm" -o -name "*.pkg" -o -name "*.exe" | \
            while read f; do sha256sum "$f" >> checksums.txt; done
          echo "=== Release artifacts ==="
          find . -type f ! -name "checksums.txt" | sort

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Jda v${{ steps.version.outputs.version }}
          body: |
            ## Jda v${{ steps.version.outputs.version }}

            ### Downloads

            | Platform | Installer | File |
            |----------|-----------|------|
            | **Windows** | `.exe` installer | `jda-${{ steps.version.outputs.version }}-windows-setup.exe` |
            | **macOS** | `.pkg` installer | `jda-${{ steps.version.outputs.version }}-macos.pkg` |
            | **Ubuntu/Debian** | `.deb` package | `jda_${{ steps.version.outputs.version }}_amd64.deb` |
            | **Fedora/RHEL** | `.rpm` package | `jda-${{ steps.version.outputs.version }}-1.x86_64.rpm` |
            | **Linux x86-64** | Tarball | `jda-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz` |
            | **Linux ARM64** | Tarball | `jda-${{ steps.version.outputs.version }}-linux-arm64.tar.gz` |
            | **macOS** | Tarball | `jda-${{ steps.version.outputs.version }}-macos.tar.gz` |

            ### One-line install (all platforms)

            ```bash
            curl -fsSL https://raw.githubusercontent.com/jdalang/jda-lang/main/install.sh | sh
            ```

            ### What's new

            - JSON parse benchmark — Jda beats C (31ms vs 32ms)
            - Getting Started guides (CLI tool, HTTP server, neural network)
            - For-loop register fix + ML demo polish
            - 114 stdlib packages

            ### What's included

            - `jda` — compiler (static ELF binary, ~1 MB)
            - `stdlib/` — 114 standard library packages
            - `tools/` — formatter, doc generator, package manager, LSP, test runner

            ### Verify

            ```bash
            sha256sum -c checksums.txt
            jda version
            ```
          files: |
            dist/*/*.tar.gz
            dist/*/*.deb
            dist/*/*.rpm
            dist/*/*.pkg
            dist/*/*.exe
            dist/checksums.txt
